<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#f8fafc"/>

  <!-- group chat -->
  <rect x="30" y="70" width="230" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="102" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">企业微信外部群</text>
  <text x="145" y="122" text-anchor="middle" font-size="12" fill="#64748b">WeCom external group</text>
  <rect x="50" y="142" width="170" height="40" rx="10" fill="#e2e8f0"/>
  <text x="62" y="167" font-size="13" fill="#0f172a">客户：@bot 营业时间？</text>
  <rect x="70" y="194" width="170" height="40" rx="10" fill="#dcfce7"/>
  <text x="82" y="219" font-size="13" fill="#14532d">bot：9:00–18:00 哦 😊</text>
  <rect x="50" y="246" width="170" height="40" rx="10" fill="#e2e8f0"/>
  <text x="62" y="271" font-size="13" fill="#0f172a">客户：@bot #下单 …</text>
  <text x="145" y="312" text-anchor="middle" font-size="12" fill="#64748b">no official bot allowed here</text>

  <!-- phone -->
  <rect x="345" y="50" width="240" height="300" rx="28" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="440" y="62" width="50" height="6" rx="3" fill="#cbd5e1"/>
  <text x="465" y="100" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">旧安卓手机</text>
  <text x="465" y="120" text-anchor="middle" font-size="12" fill="#64748b">spare Android phone</text>
  <rect x="365" y="138" width="200" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="465" y="157" text-anchor="middle" font-size="13" fill="#1e3a8a">企业微信（机器人账号）</text>
  <text x="465" y="173" text-anchor="middle" font-size="11" fill="#3b82f6">WeCom, logged in as the bot</text>
  <rect x="365" y="192" width="200" height="98" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="465" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">WeComDroid App</text>
  <text x="380" y="236" font-size="12" fill="#166534">· 通知监听 → 发现 @</text>
  <text x="380" y="254" font-size="12" fill="#166534">· 无障碍 → 读屏 / 发字 / 引用</text>
  <text x="380" y="272" font-size="12" fill="#166534">· 分享 → 发文件 · 断网不丢</text>
  <text x="465" y="320" text-anchor="middle" font-size="11" fill="#64748b">no root · no hook · official Accessibility API</text>

  <!-- server -->
  <rect x="670" y="70" width="260" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="800" y="102" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">你的服务器</text>
  <text x="800" y="122" text-anchor="middle" font-size="12" fill="#64748b">your server · Python · Docker</text>
  <rect x="690" y="140" width="220" height="44" rx="8" fill="#fef3c7" stroke="#fde68a"/>
  <text x="800" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">handle(msg, bot)</text>
  <text x="800" y="176" text-anchor="middle" font-size="11" fill="#92400e">your logic: 10 lines of Python</text>
  <text x="702" y="210" font-size="12" fill="#334155">· 关键词 FAQ</text>
  <text x="702" y="230" font-size="12" fill="#334155">· Claude AI 客服 + 知识库</text>
  <text x="702" y="250" font-size="12" fill="#334155">· 格式化接单 → 表格 → 回结果</text>
  <text x="702" y="270" font-size="12" fill="#334155">· 你的 Agent / 业务系统</text>
  <text x="800" y="306" text-anchor="middle" font-size="11" fill="#64748b">alerts · rate limits · audit log</text>

  <!-- arrows -->
  <line x1="262" y1="160" x2="343" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="343" y1="220" x2="262" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="587" y1="175" x2="668" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="668" y1="240" x2="587" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="627" y="166" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>
  <text x="627" y="258" text-anchor="middle" font-size="11" fill="#475569">commands</text>

  <text x="480" y="384" text-anchor="middle" font-size="13" fill="#475569">The phone stays dumb · all decisions live in your Python code · change logic without reinstalling the app</text>
</svg>
