<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SpareDroid demo</title>
<!--
  Source for the README images. Not a WeCom screenshot: a stylised chat UI that
  shows what the bot does. Each scene is a pure function of time, so frames are
  deterministic:  demo.html?scene=ai   then call render(ms) for each frame.
  Rebuild:  python docs/media-src/render.py
-->
<style>
  :root {
    --bg1: #eef2ff; --bg2: #f0fdf4;
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --me: #95ec69; --me-ink: #052e16; --them: #ffffff;
    --accent: #4f46e5; --ok: #16a34a;
    --code-bg: #0b1020; --code-ink: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 0% 0%, var(--bg1), transparent 60%),
                radial-gradient(900px 600px at 100% 100%, var(--bg2), transparent 60%), #f8fafc;
  }
  .stage { position: relative; width: 1280px; height: 720px; padding: 44px 56px; display: flex; gap: 48px; }

  /* ---------- left: title + phone ---------- */
  .left { width: 420px; display: flex; flex-direction: column; align-items: center; }
  .brand { align-self: flex-start; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .2px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #4f46e5, #22c55e); display: grid; place-items: center; color: #fff; font-size: 16px; }
  .phone {
    margin-top: 18px; width: 340px; height: 600px; border-radius: 44px; background: #0f172a; padding: 12px;
    box-shadow: 0 30px 60px -20px rgba(15,23,42,.45), 0 0 0 1px rgba(15,23,42,.08);
    flex: none;
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 34px; background: #ededed; overflow: hidden; display: flex; flex-direction: column; }
  .status { height: 34px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-size: 12px; font-weight: 600; background: #f7f7f7; }
  .chathead { height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #f7f7f7; border-bottom: 1px solid #e5e5e5; font-weight: 600; font-size: 15px; }
  .tag { font-size: 10px; font-weight: 600; color: #b45309; background: #fef3c7; border-radius: 4px; padding: 1px 5px; }
  .msgs { flex: 1; min-height: 0; padding: 14px 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; overflow: hidden; }
  .row { display: flex; gap: 8px; align-items: flex-start; transition: none; }
  .row.me { flex-direction: row-reverse; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700; }
  .who { font-size: 11px; color: var(--muted); margin: 0 0 3px 2px; }
  .bubble { max-width: 210px; padding: 9px 11px; border-radius: 8px; font-size: 13.5px; line-height: 1.45; background: var(--them); white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
  .me .bubble { background: var(--me); color: var(--me-ink); }
  .quote { margin-top: 5px; max-width: 210px; font-size: 11.5px; color: #555; background: #e3e3e3; border-radius: 5px; padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 8px; padding: 10px 12px; width: 210px; }
  .file .ic { width: 34px; height: 40px; border-radius: 5px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .file b { font-size: 13px; display: block; } .file span { font-size: 11px; color: var(--muted); }
  .inputbar { height: 54px; background: #f7f7f7; border-top: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .inputbar .box { flex: 1; height: 34px; border-radius: 6px; background: #fff; }
  .chip {
    position: absolute; left: 50%; top: 96px; transform: translate(-50%, 0); white-space: nowrap;
    background: rgba(15,23,42,.88); color: #fff; font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    box-shadow: 0 8px 20px -6px rgba(15,23,42,.5);
  }

  .apphead { height: 50px; display: flex; align-items: center; padding: 0 16px; gap: 8px; background: #4f46e5; color: #fff; font-weight: 700; font-size: 15px; }
  .appbody { flex: 1; background: #f1f5f9; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card2 { position: relative; background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(15,23,42,.06); }
  .card2 .lab { font-size: 12px; color: var(--muted); }
  .card2 .val { font-size: 30px; font-weight: 800; margin-top: 2px; letter-spacing: -.5px; }
  .card2 .val small { font-size: 13px; font-weight: 600; color: var(--ok); margin-left: 6px; }
  .rowlist { background: #fff; border-radius: 14px; padding: 6px 16px; font-size: 13px; }
  .rowlist div { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f1f5f9; }
  .rowlist div:last-child { border: 0; } .rowlist span { color: var(--muted); }
  .scan { position: absolute; inset: -4px; border: 2.5px solid #22c55e; border-radius: 16px; box-shadow: 0 0 0 4px rgba(34,197,94,.18); }
  .banner { position: absolute; left: 10px; right: 10px; top: 40px; background: rgba(255,255,255,.97); border-radius: 16px; padding: 11px 13px; display: flex; gap: 10px; align-items: center;
            box-shadow: 0 14px 30px -10px rgba(15,23,42,.45); font-size: 12.5px; line-height: 1.4; }
  .banner .ic { flex: none; width: 34px; height: 34px; border-radius: 9px; background: #4f46e5; color: #fff; display: grid; place-items: center; font-weight: 800; }
  .banner b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tabs { height: 54px; background: #fff; border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; align-items: center; font-size: 11.5px; color: var(--muted); }
  .tabs .on { color: #4f46e5; font-weight: 700; }

  /* ---------- right: story + server ---------- */
  .right { flex: 1; display: flex; flex-direction: column; padding-top: 6px; }
  .kicker { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  h1 { font-size: 34px; line-height: 1.25; margin-top: 8px; letter-spacing: -.3px; }
  .sub { margin-top: 10px; font-size: 16px; color: #334155; line-height: 1.6; }
  .steps { display: flex; gap: 10px; margin-top: 22px; }
  .step { font-size: 13px; padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
  .step.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .term { margin-top: 24px; flex: 1; border-radius: 16px; background: var(--code-bg); color: var(--code-ink); overflow: hidden; box-shadow: 0 30px 60px -28px rgba(15,23,42,.6); display: flex; flex-direction: column; }
  .bar { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 16px; background: #111830; font-size: 12px; color: #94a3b8; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .bar .t { margin-left: 10px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .code { padding: 14px 20px 6px; font-family: ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei", monospace; font-size: 13.5px; line-height: 1.6; color: #cbd5e1; border-bottom: 1px solid #1e293b; white-space: pre; }
  .k { color: #c084fc; } .f { color: #60a5fa; } .s { color: #86efac; } .c { color: #64748b; }
  .log { padding: 12px 20px; font-family: ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei", monospace; font-size: 13px; line-height: 1.75; }
  .log div { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .log .in { color: #93c5fd; } .log .out { color: #86efac; } .log .dim { color: #64748b; } .log .cmd { color: #fcd34d; }

  .skip { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(241,245,249,.92); backdrop-filter: blur(3px); }
  .skip .card { text-align: center; background: #fff; border-radius: 24px; padding: 30px 56px; box-shadow: 0 30px 60px -24px rgba(15,23,42,.35); border: 1px solid var(--line); }
  .skip .big { font-size: 44px; font-weight: 800; letter-spacing: .5px; }
  .skip small { display: block; font-size: 16px; font-weight: 600; color: var(--muted); margin-top: 8px; }
  .note { position: absolute; right: 22px; bottom: 14px; font-size: 11px; color: #94a3b8; }

  /* ---------- hero ---------- */
  .hero { position: relative; width: 1280px; height: 640px; padding: 70px 80px; display: flex; gap: 60px; align-items: center; }
  .hero h1 { font-size: 64px; letter-spacing: -1.5px; margin-top: 18px; }
  .hero .sub { font-size: 24px; margin-top: 16px; color: #1e293b; }
  .hero .feats { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; max-width: 640px; }
  .hero .feat { font-size: 16px; font-weight: 600; padding: 10px 16px; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 16px -10px rgba(15,23,42,.3); }
  .hero .phone { margin-top: 0; transform: scale(.92); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const AV = {"Alice": "#f97316", "Bob": "#0ea5e9", "王经理": "#8b5cf6", "Lily": "#ec4899"};
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// ---------------------------------------------------------------- scenes
// msgs:  [time, who | "me", text, {quote, file}]
// chips: [from, to, text]       log: [time, cls, text]      steps: [time, index]
const SCENES = {
  ai: {
    kicker: "用例 · AI 客服",
    title: "有人 @ 它，\n它按你的知识库回答",
    sub: "答不了的不硬编，转给同事并通知你。",
    steps: ["收到 @", "读取消息", "handle()", "回复"],
    group: "客户服务群", members: 18, dur: 10500,
    code: `<span class="k">def</span> <span class="f">handle</span>(msg, bot):
    <span class="c"># examples/claude_qa.py</span>
    answer = ask_claude(knowledge, msg.body)
    <span class="k">return</span> answer <span class="k">or</span> <span class="s">"已转人工 🙏"</span>`,
    msgs: [
      [-1, "Lily", "我们下周三能到货吗？"],
      [-1, "me", "@Lily 可以的，周二发顺丰 📦"],
      [700, "Alice", "@小助手 你们周末营业吗？"],
      [4300, "me", "@Alice 周末也营业哦，10:00–16:00 😊"],
      [6100, "Bob", "@小助手 能开专票吗？"],
      [8900, "me", "@Bob 可以的～下单后发「开票」+ 公司名称就行 🧾"],
    ],
    chips: [[1200, 2100, "🔔 有人 @ 了机器人"], [2100, 3200, "📖 读取这条消息"], [3200, 4300, "⌨️ 正在回复…"],
            [6500, 7300, "🔔 有人 @ 了机器人"], [7300, 8100, "📖 读取这条消息"], [8100, 8900, "⌨️ 正在回复…"]],
    log: [
      [-1, "dim", "sparedroid serve · handler=examples.claude_qa"],
      [1200, "in", "← 客户服务群 · Alice：你们周末营业吗？"],
      [2400, "dim", "  claude-opus-5-5 · knowledge.md (cached)"],
      [3300, "out", "→ 周末也营业哦，10:00–16:00 😊"],
      [4400, "dim", "  ✓ 已发送  2.9s"],
      [6500, "in", "← 客户服务群 · Bob：能开专票吗？"],
      [7500, "out", "→ 可以的～下单后发「开票」+ 公司名称就行 🧾"],
      [9000, "dim", "  ✓ 已发送  2.4s"],
    ],
    stepAt: [[1200, 0], [2100, 1], [2600, 2], [3600, 3], [6500, 0], [7300, 1], [7600, 2], [8300, 3]],
  },
  order: {
    kicker: "用例 · 格式化接单",
    title: "群里下单 → 进表格，\n办完引用原消息回结果",
    sub: "几小时、几天后都能回到原消息，文件也能发。",
    steps: ["下单", "校验 + 写表", "处理完回复", "发文件"],
    group: "渠道合作群", members: 6, dur: 13500,
    code: `<span class="k">def</span> <span class="f">handle</span>(msg, bot):
    order = parse(msg.body)        <span class="c"># 姓名 / 电话 / 产品 / 数量</span>
    save_to_sheet(order, msg.id)
    <span class="k">return</span> Reply(<span class="s">"收到订单啦 🎉"</span>, quote=<span class="k">True</span>)`,
    msgs: [
      [-1, "王经理", "这周还有两单，等下发群里"],
      [600, "王经理", "@小助手\n#下单\n姓名：张三\n电话：138****0000\n产品：标准版\n数量：2"],
      [3500, "me", "@王经理 收到张三的订单啦 🎉 正在处理～", {quote: "王经理：#下单 姓名：张三 电话：138…"}],
      [7900, "me", "@王经理 张三的订单已完成 ✅\n发票：https://…/inv/1024", {quote: "王经理：#下单 姓名：张三 电话：138…"}],
      [10300, "me", "", {file: ["报价单_张三.pdf", "128 KB"]}],
    ],
    chips: [[1100, 2000, "🔔 有人 @ 了机器人"], [2000, 3500, "📖 读取订单"], [7100, 7900, "↩️ 长按 → 引用"], [9500, 10300, "📤 分享 → 选群 → 核对"]],
    log: [
      [-1, "dim", "sparedroid serve · handler=examples.order_intake"],
      [1100, "in", "← 渠道合作群 · 王经理：#下单 姓名：张三 …"],
      [2300, "out", "  ✓ 校验通过 · 写入 orders.csv 第 12 行"],
      [2900, "dim", "  msg.id = 3f9a2c"],
      [6400, "cmd", "$ sparedroid reply 3f9a2c \"已完成 ✅ 发票：…\" --quote"],
      [8000, "dim", "  ✓ 已引用原消息回复"],
      [8800, "cmd", "$ sparedroid send-file 渠道合作群 报价单_张三.pdf"],
      [10400, "dim", "  ✓ 已发送文件"],
    ],
    stepAt: [[600, 0], [2300, 1], [6400, 2], [8800, 3]],
    skip: [4700, 6200, "⏱ 2 小时后", "你的系统处理完订单"],
  },
  any: {
    kicker: "不只是聊天 · 任何应用",
    title: "没有 API 的应用，\n手机替你读出来",
    sub: "通知转发到你的系统；定时打开应用，读屏幕上的数字。",
    steps: ["应用通知", "转发", "打开并读屏", "发现变化"],
    app: "小店管家", dur: 10500,
    code: `<span class="k">def</span> <span class="f">on_notification</span>(n, bot):      <span class="c"># 任何受控应用的通知</span>
    forward_to_team(n.title, n.text)
<span class="k">def</span> <span class="f">on_screen</span>(screen, bot):         <span class="c"># bot.run([...]) 的结果</span>
    value = extract(screen.texts)`,
    orders: [[-1, "12", ""], [2300, "13", "+1"]],
    banner: [700, 2900, "小店管家", "新订单：张三 下单 2 件 · ¥268"],
    scan: [5200, 6700],
    chips: [[4200, 5200, "⏰ 定时任务 · 打开应用"], [5200, 6700, "📖 读取屏幕文字"], [8300, 9300, "🏠 回到桌面"]],
    log: [
      [-1, "dim", "sparedroid serve · apps=com.example.shop"],
      [900, "in", "← [小店管家] 新订单：张三 下单 2 件 · ¥268"],
      [1900, "out", "→ 已转发到团队群（webhook）"],
      [4300, "cmd", "$ bot.run([launch, tap「数据」, read])"],
      [5400, "dim", "  读到 9 段文字"],
      [6800, "in", "← 今日订单 13 · 营业额 ¥3,668 · 待发货 4"],
      [7500, "out", "→ 今日订单 12 → 13，已写入表格"],
      [8500, "dim", "  ✓ 完成  4.1s"],
    ],
    stepAt: [[700, 0], [1900, 1], [4200, 2], [6800, 3]],
  },
};

// ---------------------------------------------------------------- helpers
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
function appear(t, at, dur = 320) { return at < 0 ? 1 : ease((t - at) / dur); }

function bubbleHTML(m, a) {
  const [_, who, text, ext = {}] = m;
  const me = who === "me";
  const style = `opacity:${a};transform:translateY(${(1 - a) * 14}px)`;
  const av = me ? `<div class="av" style="background:linear-gradient(135deg,#4f46e5,#22c55e)">S</div>`
                : `<div class="av" style="background:${AV[who] || "#94a3b8"}">${who[0]}</div>`;
  let body = ext.file
    ? `<div class="file"><div class="ic">PDF</div><div><b>${esc(ext.file[0])}</b><span>${ext.file[1]}</span></div></div>`
    : `<div class="bubble">${esc(text)}</div>`;
  if (ext.quote) body += `<div class="quote">${esc(ext.quote)}</div>`;
  const name = me ? "" : `<div class="who">${esc(who)}</div>`;
  return `<div class="row ${me ? "me" : ""}" style="${style}">${av}<div style="display:flex;flex-direction:column;align-items:${me ? "flex-end" : "flex-start"}">${name}${body}</div></div>`;
}

function appPhoneHTML(sc, t) {
  const o = sc.orders.filter(x => x[0] <= t).pop();
  const chip = (sc.chips || []).find(([a, b]) => t >= a && t < b);
  const chipA = chip ? Math.min(appear(t, chip[0], 200), 1 - ease((t - chip[1] + 200) / 200)) : 0;
  const [b0, b1, bApp, bText] = sc.banner;
  const bA = t >= b0 && t < b1 ? Math.min(appear(t, b0, 300), 1 - ease((t - b1 + 300) / 300)) : 0;
  const scan = t >= sc.scan[0] && t < sc.scan[1];
  const home = t >= 8300;
  const body = home
    ? `<div class="appbody" style="background:linear-gradient(160deg,#c7d2fe,#bbf7d0);align-items:center;justify-content:center;color:#334155;font-size:13px">桌面</div>`
    : `<div class="apphead">▦ ${esc(sc.app)}</div>
       <div class="appbody">
         <div class="card2"><div class="lab">今日订单</div><div class="val">${o[1]}${o[2] ? `<small>${o[2]}</small>` : ""}</div>${scan ? '<div class="scan"></div>' : ""}</div>
         <div class="card2"><div class="lab">今日营业额</div><div class="val">¥${o[1] === "12" ? "3,400" : "3,668"}</div>${scan ? '<div class="scan"></div>' : ""}</div>
         <div class="rowlist"><div>待发货<span>${o[1] === "12" ? 3 : 4}</span></div><div>待评价<span>7</span></div><div>退款中<span>0</span></div></div>
       </div>
       <div class="tabs"><span>首页</span><span class="on">数据</span><span>订单</span><span>我的</span></div>`;
  return `<div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>● ● ▮</span></div>
    ${body}
    ${bA > 0 ? `<div class="banner" style="opacity:${bA};transform:translateY(${(1 - bA) * -24}px)"><div class="ic">店</div><div><b>${esc(bApp)} · 现在</b>${esc(bText)}</div></div>` : ""}
    ${chip ? `<div class="chip" style="opacity:${chipA};top:${home ? 96 : 470}px">${chip[2]}</div>` : ""}
  </div></div>`;
}

function phoneHTML(sc, t) {
  if (sc.app) return appPhoneHTML(sc, t);
  const shown = sc.msgs.filter(m => m[0] <= t);
  const chip = (sc.chips || []).find(([a, b]) => t >= a && t < b);
  const chipA = chip ? Math.min(appear(t, chip[0], 200), 1 - ease((t - chip[1] + 200) / 200)) : 0;
  return `<div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>● ● ▮</span></div>
    <div class="chathead">${esc(sc.group)}<span class="tag">外部</span><span style="color:#94a3b8;font-weight:500">(${sc.members})</span></div>
    <div class="msgs">${shown.map(m => bubbleHTML(m, appear(t, m[0]))).join("")}</div>
    <div class="inputbar"><span>🎙️</span><div class="box"></div><span>😊</span><span>⊕</span></div>
    ${chip ? `<div class="chip" style="opacity:${chipA}">${chip[2]}</div>` : ""}
  </div></div>`;
}

function render(t) {
  const sc = SCENES[new URLSearchParams(location.search).get("scene") || "ai"];
  if (!sc) return renderHero();
  // GIF has 256 colours: a flat background leaves them for the chat bubbles, avatars and emoji.
  document.body.style.background = "#f5f7fb";
  const step = (sc.stepAt || []).filter(([at]) => t >= at).pop();
  const logs = sc.log.filter(l => l[0] <= t).slice(-9);
  const skip = sc.skip && t >= sc.skip[0] && t < sc.skip[1] ? sc.skip : null;
  const skipA = skip ? Math.min(appear(t, skip[0], 250), 1 - ease((t - skip[1] + 250) / 250)) : 0;
  document.getElementById("root").innerHTML = `<div class="stage">
    <div class="left"><div class="brand"><span class="logo">S</span>SpareDroid</div>${phoneHTML(sc, t)}</div>
    <div class="right">
