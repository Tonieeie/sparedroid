[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wecomdroid"
version = "0.1.0"
description = "Turn a spare Android phone into a WeCom (企业微信) group bot that works in external groups."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # the core is standard library only

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
wecomdroid = "wecomdroid.__main__:main"

[tool.setuptools.packages.find]
include = ["wecomdroid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
