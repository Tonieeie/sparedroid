[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparedroid"
version = "0.3.0"
description = "Turn a spare Android phone into an API for apps that have none: listen to notifications, read screens, act. First use case: WeCom (企业微信) external-group bots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # the core is standard library only

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
sparedroid = "sparedroid.__main__:main"

[tool.setuptools.packages.find]
include = ["sparedroid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
