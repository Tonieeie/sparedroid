name: Release APK

# Push a tag like v0.1.0 -> builds the APK and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew assembleDebug --console=plain
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "sparedroid-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: sparedroid-*.apk
          generate_release_notes: true
